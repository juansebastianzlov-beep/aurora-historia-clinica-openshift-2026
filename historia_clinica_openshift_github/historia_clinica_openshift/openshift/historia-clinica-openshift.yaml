apiVersion: v1
kind: Secret
metadata:
  name: credenciales-historia-clinica
type: Opaque
stringData:
  mysql-root-password: REEMPLAZAR_POR_CLAVE_ALEATORIA_LARGA
  mysql-app-password: REEMPLAZAR_POR_OTRA_CLAVE_ALEATORIA_LARGA
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: imagen-historia-clinica-web
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: imagen-historia-clinica-mysql
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: construir-historia-clinica-web
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/USUARIO/REPOSITORIO.git
    contextDir: .
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/php-83:latest
  output:
    to:
      kind: ImageStreamTag
      name: imagen-historia-clinica-web:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: construir-historia-clinica-mysql
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/USUARIO/REPOSITORIO.git
    contextDir: database
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: quay.io/sclorg/mysql-84-c9s:latest
  output:
    to:
      kind: ImageStreamTag
      name: imagen-historia-clinica-mysql:latest
  triggers:
    - type: ConfigChange
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: almacenamiento-historia-clinica-mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-mysql
spec:
  type: ClusterIP
  selector:
    app: historia-clinica-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: historia-clinica-mysql
spec:
  replicas: 1
  selector:
    app: historia-clinica-mysql
  strategy:
    type: Recreate
  triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - mysql
        from:
          kind: ImageStreamTag
          name: imagen-historia-clinica-mysql:latest
  template:
    metadata:
      labels:
        app: historia-clinica-mysql
    spec:
      containers:
        - name: mysql
          image: quay.io/sclorg/mysql-84-c9s:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              value: historia_clinica_demostracion
            - name: MYSQL_USER
              value: historia_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-historia-clinica
                  key: mysql-app-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-historia-clinica
                  key: mysql-root-password
          volumeMounts:
            - name: datos-mysql
              mountPath: /var/lib/mysql/data
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: datos-mysql
          persistentVolumeClaim:
            claimName: almacenamiento-historia-clinica-mysql
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: historia-clinica-web
spec:
  replicas: 1
  selector:
    app: historia-clinica-web
  strategy:
    type: Rolling
  triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - web
        from:
          kind: ImageStreamTag
          name: imagen-historia-clinica-web:latest
  template:
    metadata:
      labels:
        app: historia-clinica-web
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/php-83:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: servicio-mysql
            - name: DB_NAME
              value: historia_clinica_demostracion
            - name: DB_USER
              value: historia_app
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: credenciales-historia-clinica
                  key: mysql-app-password
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-historia-clinica-web
spec:
  type: ClusterIP
  selector:
    app: historia-clinica-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ruta-historia-clinica
spec:
  to:
    kind: Service
    name: servicio-historia-clinica-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
